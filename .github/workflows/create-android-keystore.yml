name: Create Android signing keystore (run once)

# Google sign-in only works when the APK is signed with the SAME key every time and that key's SHA-1 is registered in Firebase.
# Run this once, copy the four values into repository secrets, then DELETE the artifact. Skip it if you already have a keystore.
on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -storetype PKCS12 -keystore wycut.keystore -alias wycut -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=WyCut, OU=WyCut, O=WyCut, C=NG"
          base64 -w0 wycut.keystore > ANDROID_KEYSTORE_BASE64.txt
          printf 'ANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\nANDROID_KEY_ALIAS=wycut\n' "$PASS" "$PASS" > secrets-to-add.txt
          SHA1=$(keytool -list -v -keystore wycut.keystore -storepass "$PASS" | grep 'SHA1:' | head -1 | sed 's/.*SHA1: //')
          echo "### Add this SHA-1 in Firebase (app.wycut.vercel > Add fingerprint)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wycut-keystore-secrets
          path: |
            ANDROID_KEYSTORE_BASE64.txt
            secrets-to-add.txt
            wycut.keystore
          retention-days: 1
